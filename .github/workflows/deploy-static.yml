name: Deploy Astro Static and SSR Sites via AWS CDK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: 'Commit SHA or tag to deploy (use a previous known-good version for rollback)'
        required: true
        default: main
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.sha }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Astro dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:static

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Bootstrap CDK environment
        run: npx cdk bootstrap
        working-directory: cdk

      - name: Build container and deploy infrastructure
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json
        working-directory: cdk

      - name: Publish deployed site links
        working-directory: cdk
        run: |
          STATIC_URL=$(jq -r '.StaticSiteStack.StaticSiteUrl' cdk-outputs.json)
          DYNAMIC_URL=$(jq -r '.StaticSiteStack.SiteUrl' cdk-outputs.json)
          DEPLOYED_REF=$(git -C .. rev-parse HEAD)
          {
            echo "## Deployed sites"
            echo ""
            echo "- Deploy ref: ${DEPLOYED_REF}"
            echo "- Static site: [$STATIC_URL]($STATIC_URL)"
            echo "- Dynamic SSR site: [$DYNAMIC_URL]($DYNAMIC_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
